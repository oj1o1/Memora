<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memora — Decision Memory</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a28;
    --border: #1e1e2e;
    --border-light: #2a2a3e;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --text-muted: #555568;
    --accent: #7c6ff7;
    --accent-dim: #5a4fd4;
    --accent-glow: rgba(124,111,247,0.15);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.15);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.15);
    --yellow: #facc15;
    --yellow-dim: rgba(250,204,21,0.15);
    --blue: #60a5fa;
    --blue-dim: rgba(96,165,250,0.15);
    --cyan: #22d3ee;
    --cyan-dim: rgba(34,211,238,0.15);
    --magenta: #c084fc;
    --magenta-dim: rgba(192,132,252,0.15);
    --tag-bg: #1e1b3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Layout ── */
  .app { display: flex; height: 100vh; }
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .sidebar-header {
    padding: 1.2rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 1.1rem;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .sidebar-header h1 span { color: var(--text-dim); font-weight: 400; font-size: 0.8rem; }
  .sidebar-stats {
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 1rem;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
  .sidebar-stats strong { color: var(--accent); font-size: 0.85rem; }
  .sidebar-nav {
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex-shrink: 0;
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0.5rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.78rem;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    transition: all 0.15s;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--accent-glow); color: var(--accent); }
  .nav-btn .icon { font-size: 1rem; width: 1.2rem; text-align: center; }
  .sidebar-timeline {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
    border-top: 1px solid var(--border);
  }
  .sidebar-timeline h3 {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0.5rem 0.5rem 0.3rem;
  }

  /* ── Timeline entries ── */
  .timeline-entry {
    padding: 0.5rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    border-left: 3px solid transparent;
    margin-bottom: 2px;
    transition: all 0.15s;
  }
  .timeline-entry:hover { background: var(--surface2); }
  .timeline-entry.has-change { border-left-color: var(--yellow); }
  .timeline-entry .te-date { font-size: 0.7rem; color: var(--text-muted); }
  .timeline-entry .te-summary { font-size: 0.75rem; color: var(--text); margin-top: 2px; }
  .timeline-entry .te-type {
    display: inline-block;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 3px;
    margin-right: 4px;
    font-weight: 600;
  }
  .type-DECISION { background: var(--green-dim); color: var(--green); }
  .type-REJECTED { background: var(--red-dim); color: var(--red); }
  .type-NEXT { background: var(--yellow-dim); color: var(--yellow); }
  .type-BUG_FIXED { background: var(--blue-dim); color: var(--blue); }
  .type-CONTEXT { background: var(--cyan-dim); color: var(--cyan); }
  .type-ASSUMPTION { background: var(--yellow-dim); color: var(--yellow); }
  .type-TRADEOFF { background: var(--magenta-dim); color: var(--magenta); }
  .type-CONSTRAINT { background: var(--red-dim); color: var(--red); }
  .type-DEPENDENCY { background: var(--blue-dim); color: var(--blue); }
  .type-RISK { background: var(--red-dim); color: var(--red); }

  /* ── Main content ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .main-header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .main-header h2 { font-size: 1rem; color: var(--text); font-weight: 600; }
  .main-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: auto;
    padding: 1.5rem;
    -webkit-overflow-scrolling: touch;
  }

  /* ── Diff View (Screen 1) ── */
  .diff-container {
    max-width: 700px;
    margin: 0 auto;
  }
  .diff-badge {
    display: inline-block;
    background: var(--red-dim);
    color: var(--red);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    letter-spacing: 1px;
    margin-bottom: 0.8rem;
  }
  .diff-title {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 1.5rem;
  }
  .diff-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .diff-card h3 {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 1.2rem;
    color: var(--text);
  }
  .diff-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .diff-from, .diff-to {
    min-width: 200px;
  }
  .diff-from, .diff-to {
    flex: 1;
    border-radius: 8px;
    padding: 1rem;
  }
  .diff-from {
    background: var(--red-dim);
    border: 1px solid rgba(248,113,113,0.2);
  }
  .diff-to {
    background: var(--green-dim);
    border: 1px solid rgba(74,222,128,0.2);
  }
  .diff-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.4rem;
  }
  .diff-from .diff-label { color: var(--red); }
  .diff-to .diff-label { color: var(--green); }
  .diff-value {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
  }
  .diff-meta {
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .diff-meta-row {
    display: flex;
    gap: 0.5rem;
  }
  .diff-meta-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    min-width: 130px;
  }
  .diff-meta-value {
    font-size: 0.78rem;
    color: var(--text);
    line-height: 1.4;
  }
  .diff-meta-value.rejected { color: var(--red); }
  .diff-meta-value.impact { color: var(--green); }

  /* ── Query Panel (Screen 3) ── */
  .query-container {
    max-width: 700px;
    margin: 0 auto;
  }
  .query-input-wrap {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .query-input-wrap input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.8rem 1rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
  }
  .query-input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .query-input-wrap input::placeholder { color: var(--text-muted); }
  .query-input-wrap button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0.8rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    transition: background 0.15s;
  }
  .query-input-wrap button:hover { background: var(--accent-dim); }
  .query-answer {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 1.2rem 1.5rem;
    margin-bottom: 1.5rem;
    display: none;
  }
  .query-answer.visible { display: block; }
  .query-answer .qa-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 0.6rem;
  }
  .query-answer .qa-text {
    font-size: 0.85rem;
    color: var(--text);
    line-height: 1.6;
  }
  .query-decisions {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .query-decisions h4 {
    font-size: 0.72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.3rem;
  }

  /* ── Lineage Graph (Screen 4) ── */
  .lineage-container {
    max-width: 750px;
    margin: 0 auto;
    position: relative;
  }
  .lineage-group {
    margin-bottom: 1.5rem;
  }
  .lineage-group-label {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.5rem;
    padding-left: 2.5rem;
  }
  .lineage-track {
    display: flex;
    gap: 0;
  }
  .lineage-trunk {
    width: 2.5rem;
    min-width: 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .lineage-trunk::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border-light);
  }
  .lineage-group:last-child .lineage-trunk::before { bottom: 50%; }
  .lineage-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    position: relative;
    z-index: 1;
    margin-top: 1rem;
    flex-shrink: 0;
  }
  .lineage-dot.dot-rejected { background: var(--red); box-shadow: 0 0 8px var(--red-dim); }
  .lineage-dot.dot-fix { background: var(--blue); box-shadow: 0 0 8px var(--blue-dim); }
  .lineage-dot.dot-risk { background: var(--yellow); box-shadow: 0 0 8px var(--yellow-dim); }
  .lineage-dot.dot-next { background: var(--cyan); box-shadow: 0 0 8px var(--cyan-dim); }
  .lineage-dot.dot-tradeoff { background: var(--yellow); }
  .lineage-dot.dot-constraint { background: var(--red); }
  .lineage-cards {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    padding: 0.3rem 0;
  }
  .lineage-node {
    position: relative;
    padding: 0;
    margin: 0;
    border: none;
  }
  .lineage-node .ln-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    transition: border-color 0.15s, transform 0.1s;
    cursor: pointer;
  }
  .lineage-node .ln-card:hover { border-color: var(--accent); transform: translateX(2px); }
  .lineage-node.rejected .ln-card { border-left: 3px solid var(--red); }
  .lineage-node.change .ln-card { border-left: 3px solid var(--yellow); }
  .lineage-node.fix .ln-card { border-left: 3px solid var(--blue); }
  .lineage-node .ln-summary {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
  }
  .lineage-node .ln-reason {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 0.25rem;
    line-height: 1.4;
  }
  .lineage-node .ln-meta {
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .lineage-connector {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.65rem;
    padding: 0.1rem 0 0.1rem 2.5rem;
    letter-spacing: 0.5px;
    border-left: 2px solid var(--border-light);
  }

  /* ── Decision cards (reusable) ── */
  .decision-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.8rem 1rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .decision-card:hover { border-color: var(--accent); }
  .decision-card .dc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.3rem;
  }
  .decision-card .dc-summary { font-size: 0.82rem; font-weight: 600; flex: 1; word-break: break-word; }
  .decision-card .dc-meta { font-size: 0.65rem; color: var(--text-muted); white-space: nowrap; margin-left: 0.8rem; }
  .decision-card .dc-reasoning { font-size: 0.75rem; color: var(--text-dim); line-height: 1.4; word-break: break-word; }
  .decision-card .dc-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.4rem; }
  .tag {
    background: var(--tag-bg);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.65rem;
  }

  /* ── All Decisions list view ── */
  .all-decisions { display: flex; flex-direction: column; gap: 0.5rem; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; min-width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .sidebar-timeline { max-height: 120px; }
    .diff-row { flex-direction: column; }
    .diff-from, .diff-to { min-width: 0; }
    .main-header { flex-wrap: wrap; }
    .header-search { max-width: 100%; }
  }

  /* ── Search bar in header ── */
  .header-search {
    flex: 1;
    max-width: 300px;
    margin-left: auto;
  }
  .header-search input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.78rem;
    outline: none;
  }
  .header-search input:focus { border-color: var(--accent); }

  /* ── Type filter pills ── */
  .type-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding: 0.5rem;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .type-pill {
    font-size: 0.65rem;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: inherit;
    font-weight: 600;
    transition: all 0.15s;
  }
  .type-pill:hover { opacity: 0.8; }
  .type-pill.active { border-color: currentColor; }
  .type-pill.all { background: var(--surface2); color: var(--text-dim); }
  .type-pill.all.active { color: var(--text); border-color: var(--text-dim); }

  /* ── Modal (add/edit/detail) ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    width: 90%;
    max-width: 560px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 0.95rem; margin-bottom: 1rem; color: var(--accent); }
  .modal label {
    display: block;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 0.2rem;
    margin-top: 0.7rem;
  }
  .modal input, .modal textarea, .modal select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.45rem 0.6rem;
    border-radius: 5px;
    font-family: inherit;
    font-size: 0.78rem;
    outline: none;
  }
  .modal select { cursor: pointer; }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  .btn {
    border: none;
    padding: 0.45rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-cancel { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-delete { background: var(--red); color: #fff; margin-right: auto; }

  /* ── Loading / empty ── */
  .loading, .empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
    font-size: 0.82rem;
  }
  .loading::after {
    content: '';
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--accent);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-left: 0.5rem;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  /* ── Try it live banner ── */
  .try-banner {
    background: linear-gradient(135deg, rgba(124,111,247,0.15), rgba(74,222,128,0.1));
    border: 1px solid rgba(124,111,247,0.3);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .try-banner-text {
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .try-banner-text strong { color: var(--accent); }
  .try-banner .btn-try {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0.4rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .try-banner .btn-try:hover { opacity: 0.85; }
  .try-banner-close {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 0 0.3rem;
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1><a href="/" style="color:inherit;text-decoration:none">MEMORA</a> <span>decision memory</span></h1>
      <div style="display:flex;gap:0.5rem;margin-top:0.5rem;align-items:center">
        <span id="backendBadge" style="display:inline-block;font-size:0.6rem;padding:2px 7px;border-radius:3px;font-weight:700;letter-spacing:0.5px;background:rgba(74,222,128,0.15);color:#4ade80">LOCAL</span>
        <span id="workspaceBadge" style="display:inline-block;font-size:0.6rem;padding:2px 7px;border-radius:3px;font-weight:700;letter-spacing:0.5px;background:#1a1a28;color:#8888a0">local</span>
      </div>
    </div>
    <div class="sidebar-stats" id="sidebarStats"></div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" data-view="timeline" onclick="switchView('timeline')">
        <span class="icon">|</span> Timeline
      </button>
      <button class="nav-btn" data-view="query" onclick="switchView('query')">
        <span class="icon">?</span> Why Query
      </button>
      <button class="nav-btn" data-view="lineage" onclick="switchView('lineage')">
        <span class="icon">~</span> Lineage
      </button>
      <button class="nav-btn" data-view="all" onclick="switchView('all')">
        <span class="icon">#</span> All Decisions
      </button>
    </nav>
    <div class="type-filters" id="typeFilters">
      <button class="type-pill all active" onclick="filterType('')">ALL</button>
      <button class="type-pill type-DECISION" onclick="filterType('DECISION')">DECISION</button>
      <button class="type-pill type-REJECTED" onclick="filterType('REJECTED')">REJECTED</button>
      <button class="type-pill type-NEXT" onclick="filterType('NEXT')">NEXT</button>
      <button class="type-pill type-BUG_FIXED" onclick="filterType('BUG_FIXED')">BUG_FIXED</button>
      <button class="type-pill type-CONTEXT" onclick="filterType('CONTEXT')">CONTEXT</button>
      <button class="type-pill type-ASSUMPTION" onclick="filterType('ASSUMPTION')">ASSUMPTION</button>
      <button class="type-pill type-TRADEOFF" onclick="filterType('TRADEOFF')">TRADEOFF</button>
      <button class="type-pill type-CONSTRAINT" onclick="filterType('CONSTRAINT')">CONSTRAINT</button>
      <button class="type-pill type-DEPENDENCY" onclick="filterType('DEPENDENCY')">DEPENDENCY</button>
      <button class="type-pill type-RISK" onclick="filterType('RISK')">RISK</button>
    </div>
    <div class="sidebar-timeline" id="sidebarTimeline">
      <h3>Recent Activity</h3>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main">
    <div class="try-banner" id="tryBanner">
      <div class="try-banner-text"><strong>Try it live</strong> &mdash; Click "+ New" to record a decision. It persists to the cloud and syncs across all connected agents.</div>
      <button class="btn-try" onclick="showAddModal()">+ Record Decision</button>
      <button class="try-banner-close" onclick="document.getElementById('tryBanner').style.display='none'">&times;</button>
    </div>
    <div class="main-header">
      <h2 id="viewTitle">Reasoning Timeline</h2>
      <div class="header-search">
        <input type="text" id="globalSearch" placeholder="Search decisions..." onkeydown="if(event.key==='Enter')globalSearchDo()" />
      </div>
      <button class="btn btn-save" onclick="showAddModal()" style="margin-left:0.5rem">+ New</button>
    </div>
    <div class="main-content" id="mainContent"></div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)hideModal()">
  <div class="modal">
    <h2 id="modalTitle">New Decision</h2>
    <input type="hidden" id="fId" />
    <label>Type</label>
    <select id="fType">
      <option value="DECISION">DECISION</option>
      <option value="REJECTED">REJECTED</option>
      <option value="NEXT">NEXT</option>
      <option value="BUG_FIXED">BUG_FIXED</option>
      <option value="CONTEXT">CONTEXT</option>
    </select>
    <label>Summary</label>
    <input type="text" id="fSummary" placeholder="What was decided" />
    <label>Reasoning</label>
    <textarea id="fReasoning" placeholder="Why this choice was made"></textarea>
    <label>Alternatives rejected (comma-separated)</label>
    <input type="text" id="fAlternatives" placeholder="Option A, Option B" />
    <label>Tags (comma-separated)</label>
    <input type="text" id="fTags" placeholder="database, auth, api" />
    <label>Project</label>
    <input type="text" id="fProject" placeholder="project-name" />
    <label>Agent / Author</label>
    <input type="text" id="fAgent" placeholder="name" />
    <div class="modal-actions">
      <button class="btn btn-delete" id="btnDelete" style="display:none" onclick="doDelete()">Delete</button>
      <button class="btn btn-cancel" onclick="hideModal()">Cancel</button>
      <button class="btn btn-save" onclick="doSave()">Save</button>
    </div>
  </div>
</div>

<script>
const API = window.location.origin + '/api';
let allDecisions = [];
let currentView = 'timeline';
let currentTypeFilter = '';

// ── Demo data (shown when backend has no decisions) ──
const DEMO_DECISIONS = [
  {
    id: 'demo-1', type: 'DECISION',
    summary: 'Use BM25 retrieval over vector search',
    reasoning: 'Vector embeddings performed poorly on short, keyword-heavy queries. BM25 gave 40% better recall for our use case with deterministic, reproducible results.',
    tags: ['retrieval', 'search', 'bm25'], agent: 'Rahul',
    alternatives: ['OpenAI ada-002', 'sentence-transformers'],
    created_at: new Date().toISOString()
  },
  {
    id: 'demo-2', type: 'TRADEOFF',
    summary: 'Vector search failed on short queries',
    reasoning: 'Tested sentence-transformers and OpenAI ada-002. Both degraded below 5-word queries. Switched to BM25 with FTS5 for consistent sub-10ms latency.',
    tags: ['vector-search', 'performance', 'latency'], agent: 'Rahul',
    alternatives: [],
    created_at: new Date(Date.now() - 86400000).toISOString()
  },
  {
    id: 'demo-3', type: 'CONSTRAINT',
    summary: 'Client required deterministic responses',
    reasoning: 'Enterprise client contract mandates reproducible outputs. Ruled out any non-deterministic ranking. All search results must be explainable and auditable.',
    tags: ['enterprise', 'compliance', 'deterministic'], agent: 'Priya',
    alternatives: [],
    created_at: new Date(Date.now() - 172800000).toISOString()
  }
];

// ── Data loading ──
async function loadAll() {
  let decisions = [];
  let stats = { total: 0, tags: {}, types: {} };
  try {
    const [dRes, sRes] = await Promise.all([
      fetch(`${API}/decisions?limit=200`),
      fetch(`${API}/stats`),
    ]);
    const dData = await dRes.json();
    decisions = dData.results || dData;
    stats = await sRes.json();
  } catch (e) { /* graceful offline fallback */ }

  if (!decisions.length) {
    decisions = DEMO_DECISIONS;
    stats = {
      total: decisions.length,
      tags: { retrieval: 1, search: 1, bm25: 1, 'vector-search': 1, performance: 1, latency: 1, enterprise: 1, compliance: 1, deterministic: 1 },
      types: { DECISION: 1, TRADEOFF: 1, CONSTRAINT: 1 }
    };
  }
  allDecisions = decisions;
  renderSidebarStats(stats);
  renderSidebarTimeline();
  renderCurrentView();
}

function filtered() {
  if (!currentTypeFilter) return allDecisions;
  return allDecisions.filter(d => d.type === currentTypeFilter);
}

function renderSidebarStats(s) {
  const types = s.types || {};
  document.getElementById('sidebarStats').innerHTML =
    `<div><strong>${s.total}</strong> total</div>` +
    `<div><strong>${Object.keys(s.tags).length}</strong> tags</div>` +
    `<div><strong>${Object.keys(types).length}</strong> types</div>`;
}

function renderSidebarTimeline() {
  const el = document.getElementById('sidebarTimeline');
  const decisions = filtered();
  // Group by date
  const groups = {};
  decisions.forEach(d => {
    const date = (d.created_at || '').substring(0, 10);
    if (!groups[date]) groups[date] = [];
    groups[date].push(d);
  });
  const dates = Object.keys(groups).sort().reverse();
  let html = '<h3>Recent Activity</h3>';
  dates.forEach((date, i) => {
    const items = groups[date];
    const hasChange = items.some(d => ['REJECTED','BUG_FIXED'].includes(d.type));
    items.forEach(d => {
      const cls = hasChange && ['REJECTED','BUG_FIXED'].includes(d.type) ? 'has-change' : '';
      html += `
        <div class="timeline-entry ${cls}" onclick="showDiffView('${d.id}')">
          <div class="te-date">${date}</div>
          <div class="te-summary">
            <span class="te-type type-${d.type || 'DECISION'}">${d.type || 'DECISION'}</span>
            ${esc(d.summary.substring(0, 50))}
          </div>
        </div>`;
    });
  });
  if (!decisions.length) html += '<div class="empty-state">No decisions yet</div>';
  el.innerHTML = html;
}

// ── View switching ──
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const titles = { timeline: 'Reasoning Timeline', query: 'Why did this change?', lineage: 'Behavior Lineage', all: 'All Decisions' };
  document.getElementById('viewTitle').textContent = titles[view] || '';
  renderCurrentView();
}

function filterType(type) {
  currentTypeFilter = type;
  document.querySelectorAll('.type-pill').forEach(p => {
    if (type === '' && p.classList.contains('all')) p.classList.add('active');
    else if (p.textContent === type) p.classList.add('active');
    else p.classList.remove('active');
  });
  renderSidebarTimeline();
  renderCurrentView();
}

function renderCurrentView() {
  const el = document.getElementById('mainContent');
  switch (currentView) {
    case 'timeline': renderTimeline(el); break;
    case 'query': renderQueryPanel(el); break;
    case 'lineage': renderLineage(el); break;
    case 'all': renderAllDecisions(el); break;
  }
}

// ── Screen 1 & 2: Timeline with diff view ──
function renderTimeline(el) {
  const decisions = filtered();
  if (!decisions.length) {
    el.innerHTML = '<div class="empty-state">No decisions recorded yet. Click "+ New" to add one.</div>';
    return;
  }
  // Group by date
  const groups = {};
  decisions.forEach(d => {
    const date = (d.created_at || '').substring(0, 10);
    if (!groups[date]) groups[date] = [];
    groups[date].push(d);
  });
  const dates = Object.keys(groups).sort().reverse();

  let html = '';
  dates.forEach((date, sessionIdx) => {
    const items = groups[date];
    const hasChange = items.some(d => ['REJECTED','BUG_FIXED'].includes(d.type));
    const sessionNum = dates.length - sessionIdx;
    const changeBadge = hasChange ? ' <span style="color:var(--yellow);font-size:0.75rem">CHANGE DETECTED</span>' : '';
    html += `<div style="margin-bottom:1.5rem">
      <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem;display:flex;align-items:center;gap:0.5rem">
        <span style="font-weight:600;color:var(--text-dim)">Session ${sessionNum}</span>
        <span>${date}</span>
        ${changeBadge}
      </div>`;
    items.forEach(d => {
      const typeClass = `type-${d.type || 'DECISION'}`;
      const changeMarker = ['REJECTED','BUG_FIXED'].includes(d.type) ? 'border-left:3px solid var(--yellow);' : '';
      html += `
        <div class="decision-card" style="${changeMarker}margin-bottom:0.5rem" onclick="showDiffView('${d.id}')">
          <div class="dc-header">
            <div class="dc-summary"><span class="te-type ${typeClass}">${d.type || 'DECISION'}</span> ${esc(d.summary)}</div>
            <div class="dc-meta">${esc(d.agent || d.source || '')}</div>
          </div>
          <div class="dc-reasoning">${esc(d.reasoning)}</div>
          <div class="dc-tags">
            ${(d.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
          </div>
          ${(d.alternatives || []).length ? `<div style="font-size:0.7rem;color:var(--red);margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid var(--border)">Rejected: ${d.alternatives.map(esc).join(', ')}</div>` : ''}
        </div>`;
    });
    html += '</div>';
  });
  el.innerHTML = html;
}

// ── Screen 1: Diff detail view ──
function showDiffView(id) {
  const d = allDecisions.find(x => x.id === id);
  if (!d) return;
  // Find a related decision with same tags to show diff
  const related = allDecisions.find(r =>
    r.id !== d.id &&
    r.tags && d.tags &&
    r.tags.some(t => d.tags.includes(t)) &&
    r.type !== d.type
  );

  const el = document.getElementById('mainContent');
  document.getElementById('viewTitle').textContent = 'Decision Detail';

  let html = '<div class="diff-container">';

  if (related) {
    const olderDate = (related.created_at || '').substring(0, 10);
    const newerDate = (d.created_at || '').substring(0, 10);
    html += `
      <div class="diff-badge">CHANGE DETECTED</div>
      <div class="diff-title">${olderDate} &rarr; ${newerDate}</div>
      <div class="diff-card">
        <h3>${esc(d.summary)}</h3>
        <div class="diff-row">
          <div class="diff-from">
            <div class="diff-label">FROM</div>
            <div class="diff-value">${esc(related.summary.substring(0, 40))}</div>
          </div>
          <div class="diff-to">
            <div class="diff-label">TO</div>
            <div class="diff-value">${esc(d.summary.substring(0, 40))}</div>
          </div>
        </div>
        <div class="diff-meta">
          <div class="diff-meta-row"><div class="diff-meta-label">Reason:</div><div class="diff-meta-value">${esc(d.reasoning)}</div></div>
          ${(d.alternatives || []).length ? `<div class="diff-meta-row"><div class="diff-meta-label">Alternatives rejected:</div><div class="diff-meta-value rejected">${d.alternatives.map(esc).join(', ')}</div></div>` : ''}
          ${d.agent ? `<div class="diff-meta-row"><div class="diff-meta-label">Author:</div><div class="diff-meta-value">${esc(d.agent)}</div></div>` : ''}
        </div>
      </div>`;
  } else {
    // Single decision detail
    html += `
      <div class="diff-card">
        <h3><span class="te-type type-${d.type || 'DECISION'}">${d.type || 'DECISION'}</span> ${esc(d.summary)}</h3>
        <div class="diff-meta">
          <div class="diff-meta-row"><div class="diff-meta-label">Reasoning:</div><div class="diff-meta-value">${esc(d.reasoning)}</div></div>
          ${(d.alternatives || []).length ? `<div class="diff-meta-row"><div class="diff-meta-label">Alternatives rejected:</div><div class="diff-meta-value rejected">${d.alternatives.map(esc).join(', ')}</div></div>` : ''}
          ${(d.tags || []).length ? `<div class="diff-meta-row"><div class="diff-meta-label">Tags:</div><div class="diff-meta-value">${d.tags.map(t => `<span class="tag">${esc(t)}</span>`).join(' ')}</div></div>` : ''}
          ${d.agent ? `<div class="diff-meta-row"><div class="diff-meta-label">Author:</div><div class="diff-meta-value">${esc(d.agent)}</div></div>` : ''}
          ${d.project ? `<div class="diff-meta-row"><div class="diff-meta-label">Project:</div><div class="diff-meta-value">${esc(d.project)}</div></div>` : ''}
          <div class="diff-meta-row"><div class="diff-meta-label">Source:</div><div class="diff-meta-value">${esc(d.source || 'unknown')}</div></div>
          <div class="diff-meta-row"><div class="diff-meta-label">Confidence:</div><div class="diff-meta-value">${d.confidence}</div></div>
          <div class="diff-meta-row"><div class="diff-meta-label">Created:</div><div class="diff-meta-value">${esc(d.created_at || '')}</div></div>
        </div>
      </div>`;
  }

  html += `<button class="btn btn-cancel" onclick="renderCurrentView()" style="margin-top:1rem">&larr; Back</button>`;
  html += '</div>';
  el.innerHTML = html;
}

// ── Screen 3: Why Query ──
function renderQueryPanel(el) {
  const examples = [
    'Why did we choose SQLite?',
    'What was rejected for IDE integration?',
    'Why Turso over PlanetScale?',
    'What bugs were fixed?',
  ];
  const exampleHtml = examples.map(q =>
    `<button onclick="document.getElementById('queryInput').value='${q}';doQuery()" style="background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:0.3rem 0.7rem;border-radius:5px;cursor:pointer;font-size:0.72rem;font-family:inherit;transition:border-color 0.15s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">${q}</button>`
  ).join('');

  el.innerHTML = `
    <div class="query-container">
      <div class="query-input-wrap">
        <input type="text" id="queryInput" placeholder="Ask anything about past decisions..." onkeydown="if(event.key==='Enter')doQuery()" />
        <button onclick="doQuery()">Ask Memora</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.5rem">${exampleHtml}</div>
      <div class="query-answer" id="queryAnswer">
        <div class="qa-label">MEMORA ANSWER</div>
        <div class="qa-text" id="queryAnswerText"></div>
      </div>
      <div class="query-decisions" id="queryDecisions"></div>
    </div>`;
}

async function doQuery() {
  const input = document.getElementById('queryInput');
  if (!input) return;
  const question = input.value.trim();
  if (!question) return;

  const answerEl = document.getElementById('queryAnswer');
  const textEl = document.getElementById('queryAnswerText');
  const decEl = document.getElementById('queryDecisions');

  answerEl.classList.add('visible');
  textEl.innerHTML = '<span class="loading">Thinking</span>';
  decEl.innerHTML = '';

  try {
    const res = await fetch(`${API}/why`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question }),
    });
    const data = await res.json();

    if (data.answer && !data.answer.startsWith('Could not generate')) {
      textEl.textContent = data.answer;
    } else {
      // Fallback: local search when AI is unavailable
      const matches = localSearch(question);
      if (matches.length) {
        textEl.textContent = matches.map(d =>
          `[${d.type}] ${d.summary}: ${d.reasoning}`
        ).join('\n\n');
      } else {
        textEl.textContent = data.answer || 'No relevant decisions found.';
      }
      data.decisions = data.decisions || matches;
    }

    const decs = data.decisions || [];
    if (decs.length) {
      let html = '<h4>Related Decisions</h4>';
      decs.forEach(d => {
        html += `
          <div class="decision-card" onclick="showDiffView('${d.id}')" style="margin-bottom:0.5rem">
            <div class="dc-header">
              <div class="dc-summary"><span class="te-type type-${d.type || 'DECISION'}">${d.type || 'DECISION'}</span> ${esc(d.summary)}</div>
              <div class="dc-meta">${(d.created_at || '').substring(0, 10)}</div>
            </div>
            <div class="dc-reasoning">${esc(d.reasoning)}</div>
          </div>`;
      });
      decEl.innerHTML = html;
    }
  } catch (e) {
    // Full fallback: search locally in loaded decisions
    const matches = localSearch(question);
    if (matches.length) {
      textEl.textContent = matches.map(d =>
        `[${d.type}] ${d.summary}: ${d.reasoning}`
      ).join('\n\n');
      let html = '<h4>Related Decisions</h4>';
      matches.forEach(d => {
        html += `
          <div class="decision-card" onclick="showDiffView('${d.id}')" style="margin-bottom:0.5rem">
            <div class="dc-header">
              <div class="dc-summary"><span class="te-type type-${d.type || 'DECISION'}">${d.type || 'DECISION'}</span> ${esc(d.summary)}</div>
              <div class="dc-meta">${(d.created_at || '').substring(0, 10)}</div>
            </div>
            <div class="dc-reasoning">${esc(d.reasoning)}</div>
          </div>`;
      });
      decEl.innerHTML = html;
    } else {
      textEl.textContent = 'No relevant decisions found.';
    }
  }
}

// ── Local search fallback ──
function localSearch(query) {
  const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 2);
  return allDecisions.filter(d => {
    const text = `${d.summary} ${d.reasoning} ${(d.tags||[]).join(' ')} ${d.type} ${d.agent||''}`.toLowerCase();
    return words.some(w => text.includes(w));
  }).slice(0, 5);
}

// ── Screen 4: Lineage Graph ──
function renderLineage(el) {
  const decisions = filtered();
  if (!decisions.length) {
    el.innerHTML = '<div class="empty-state">No decisions to visualize.</div>';
    return;
  }
  // Group by shared tags to show related decision chains
  const sorted = [...decisions].sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));

  // Build tag-based clusters
  const tagGroups = {};
  sorted.forEach(d => {
    const mainTag = (d.tags && d.tags[0]) || d.project || 'general';
    if (!tagGroups[mainTag]) tagGroups[mainTag] = [];
    tagGroups[mainTag].push(d);
  });

  // Merge small groups into nearest related group
  const groups = {};
  Object.entries(tagGroups).forEach(([tag, items]) => {
    if (items.length === 1) {
      // Try to merge with a group that shares a tag
      const d = items[0];
      const merged = Object.keys(groups).find(g =>
        (d.tags || []).includes(g) || (d.project && g === d.project)
      );
      if (merged) { groups[merged].push(d); return; }
    }
    if (!groups[tag]) groups[tag] = [];
    groups[tag].push(...items);
  });

  let html = '<div class="lineage-container">';
  const groupEntries = Object.entries(groups);

  groupEntries.forEach(([tag, items], gi) => {
    const dotType = items.some(d => d.type === 'REJECTED') ? 'dot-rejected' :
                    items.some(d => d.type === 'BUG_FIXED') ? 'dot-fix' :
                    items.some(d => d.type === 'RISK') ? 'dot-risk' :
                    items.some(d => d.type === 'TRADEOFF') ? 'dot-tradeoff' : '';

    html += `<div class="lineage-group">`;
    html += `<div class="lineage-group-label">${esc(tag)}</div>`;
    html += `<div class="lineage-track">`;
    html += `<div class="lineage-trunk"><div class="lineage-dot ${dotType}"></div></div>`;
    html += `<div class="lineage-cards">`;

    items.forEach(d => {
      const isRejected = d.type === 'REJECTED';
      const isFix = d.type === 'BUG_FIXED';
      const isChange = ['TRADEOFF', 'RISK', 'CONSTRAINT'].includes(d.type);
      const cls = isRejected ? 'rejected' : isFix ? 'fix' : isChange ? 'change' : '';
      const date = (d.created_at || '').substring(0, 10);

      html += `
        <div class="lineage-node ${cls}">
          <div class="ln-card" onclick="showDiffView('${d.id}')">
            <div class="ln-summary"><span class="te-type type-${d.type || 'DECISION'}">${d.type || 'DECISION'}</span> ${esc(d.summary)}</div>
            <div class="ln-reason">${esc(d.reasoning.substring(0, 140))}</div>
            <div class="ln-meta">
              <span>${date}</span>
              ${d.agent ? '<span>&middot; ' + esc(d.agent) + '</span>' : ''}
              ${(d.tags || []).slice(0,3).map(t => '<span class="tag" style="font-size:0.6rem;padding:1px 5px">' + esc(t) + '</span>').join('')}
            </div>
          </div>
        </div>`;
    });

    html += `</div></div></div>`;

    if (gi < groupEntries.length - 1) {
      html += `<div class="lineage-connector">&#x2502;</div>`;
    }
  });
  html += '</div>';
  el.innerHTML = html;
}

// ── All Decisions ──
function renderAllDecisions(el) {
  const decisions = filtered();
  if (!decisions.length) {
    el.innerHTML = '<div class="empty-state">No decisions found.</div>';
    return;
  }
  let html = '<div class="all-decisions">';
  decisions.forEach(d => {
    const date = (d.created_at || '').substring(0, 10);
    html += `
      <div class="decision-card" onclick="showDiffView('${d.id}')">
        <div class="dc-header">
          <div class="dc-summary"><span class="te-type type-${d.type || 'DECISION'}">${d.type || 'DECISION'}</span> ${esc(d.summary)}</div>
          <div class="dc-meta">${esc(d.source || '')} &middot; ${date}</div>
        </div>
        <div class="dc-reasoning">${esc(d.reasoning)}</div>
        <div class="dc-tags">
          ${(d.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
        </div>
        ${(d.alternatives || []).length ? `<div style="font-size:0.7rem;color:var(--red);margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid var(--border)">Rejected: ${d.alternatives.map(esc).join(', ')}</div>` : ''}
      </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

// ── Global search ──
async function globalSearchDo() {
  const q = document.getElementById('globalSearch').value.trim();
  if (!q) { loadAll(); return; }
  const res = await fetch(`${API}/decisions?search=${encodeURIComponent(q)}`);
  const sData = await res.json();
  allDecisions = sData.results || sData;  // unwrap pagination envelope
  renderSidebarTimeline();
  renderCurrentView();
}

// ── Modal ──
function showAddModal() {
  document.getElementById('modalTitle').textContent = 'New Decision';
  document.getElementById('fId').value = '';
  document.getElementById('fType').value = 'DECISION';
  document.getElementById('fSummary').value = '';
  document.getElementById('fReasoning').value = '';
  document.getElementById('fAlternatives').value = '';
  document.getElementById('fTags').value = '';
  document.getElementById('fProject').value = '';
  document.getElementById('fAgent').value = '';
  document.getElementById('btnDelete').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('active');
}

async function doSave() {
  const body = {
    type: document.getElementById('fType').value,
    summary: document.getElementById('fSummary').value,
    reasoning: document.getElementById('fReasoning').value,
    alternatives: document.getElementById('fAlternatives').value.split(',').map(s => s.trim()).filter(Boolean),
    tags: document.getElementById('fTags').value.split(',').map(s => s.trim()).filter(Boolean),
    project: document.getElementById('fProject').value,
    agent: document.getElementById('fAgent').value,
    source: 'dashboard',
  };
  await fetch(`${API}/decisions`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  hideModal();
  loadAll();
}

async function doDelete() {
  const id = document.getElementById('fId').value;
  if (!id || !confirm('Delete this decision?')) return;
  await fetch(`${API}/decisions?id=${id}`, { method: 'DELETE' });
  hideModal();
  loadAll();
}

function hideModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Live polling — auto-refresh when MCP or other sources add decisions ──
let _lastCount = 0;
async function pollForChanges() {
  try {
    const res = await fetch(`${API}/stats`);
    const s = await res.json();
    if (_lastCount && s.total !== _lastCount) {
      loadAll();
    }
    _lastCount = s.total;
  } catch (e) { /* ignore network errors */ }
}
setInterval(pollForChanges, 3000);

// ── Backend badge ──
async function loadBackendBadge() {
  try {
    const res = await fetch(`${API}/backend`);
    if (res.ok) {
      const data = await res.json();
      const mode = data.mode || 'LOCAL';
      const el = document.getElementById('backendBadge');
      el.textContent = mode;
      const colors = { LOCAL: ['rgba(74,222,128,0.15)','#4ade80'], REMOTE: ['rgba(34,211,238,0.15)','#22d3ee'], TURSO: ['rgba(192,132,252,0.15)','#c084fc'] };
      const [bg, fg] = colors[mode] || colors.LOCAL;
      el.style.background = bg;
      el.style.color = fg;
    }
  } catch (e) { /* ignore */ }
}

// ── Init ──
loadBackendBadge();
loadAll();
</script>
