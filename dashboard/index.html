<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memora — Decision Memory Dashboard</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a28;
    --border: #1e1e2e;
    --border-light: #2a2a3e;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --text-muted: #555568;
    --accent: #7c6ff7;
    --accent-dim: #5a4fd4;
    --accent-glow: rgba(124,111,247,0.15);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.15);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.15);
    --yellow: #facc15;
    --yellow-dim: rgba(250,204,21,0.15);
    --blue: #60a5fa;
    --blue-dim: rgba(96,165,250,0.15);
    --cyan: #22d3ee;
    --cyan-dim: rgba(34,211,238,0.15);
    --magenta: #c084fc;
    --magenta-dim: rgba(192,132,252,0.15);
    --tag-bg: #1e1b3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Layout */
  .app { display: flex; height: 100vh; }
  .sidebar {
    width: 280px; min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-header {
    padding: 1.2rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 1.1rem; color: var(--accent);
    font-weight: 700; letter-spacing: 0.5px;
  }
  .sidebar-header h1 span { color: var(--text-dim); font-weight: 400; font-size: 0.8rem; }

  /* Backend badge */
  .backend-badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-left: 0.5rem;
    vertical-align: middle;
  }
  .badge-LOCAL { background: var(--green-dim); color: var(--green); }
  .badge-REMOTE { background: var(--cyan-dim); color: var(--cyan); }
  .badge-TURSO { background: var(--magenta-dim); color: var(--magenta); }
  .badge-workspace { background: var(--surface2); color: var(--text-dim); }

  /* Stats bar */
  .sidebar-stats {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 0.8rem; flex-wrap: wrap;
    font-size: 0.7rem; color: var(--text-dim);
  }
  .sidebar-stats strong { color: var(--accent); font-size: 0.85rem; }

  /* Workspace selector */
  .workspace-bar {
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.7rem; color: var(--text-dim);
  }
  .workspace-bar select {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 0.2rem 0.4rem; border-radius: 4px;
    font-family: inherit; font-size: 0.7rem; cursor: pointer;
  }

  /* Nav */
  .sidebar-nav {
    padding: 0.5rem;
    display: flex; flex-direction: column; gap: 2px;
  }
  .nav-btn {
    background: transparent; border: none;
    color: var(--text-dim); padding: 0.5rem 0.8rem;
    border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 0.78rem;
    text-align: left; display: flex;
    align-items: center; gap: 0.6rem;
    transition: all 0.15s;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--accent-glow); color: var(--accent); }
  .nav-btn .icon { font-size: 1rem; width: 1.2rem; text-align: center; }

  /* Type filter pills */
  .type-filters {
    display: flex; flex-wrap: wrap; gap: 0.3rem;
    padding: 0.5rem; border-bottom: 1px solid var(--border);
  }
  .type-pill {
    font-size: 0.6rem; padding: 2px 7px; border-radius: 4px;
    cursor: pointer; border: 1px solid transparent;
    font-family: inherit; font-weight: 600; transition: all 0.15s;
  }
  .type-pill:hover { opacity: 0.8; }
  .type-pill.active { border-color: currentColor; }
  .type-pill.all { background: var(--surface2); color: var(--text-dim); }
  .type-pill.all.active { color: var(--text); border-color: var(--text-dim); }
  .type-DECISION { background: var(--green-dim); color: var(--green); }
  .type-REJECTED { background: var(--red-dim); color: var(--red); }
  .type-NEXT { background: var(--yellow-dim); color: var(--yellow); }
  .type-BUG_FIXED { background: var(--blue-dim); color: var(--blue); }
  .type-CONTEXT { background: var(--cyan-dim); color: var(--cyan); }
  .type-ASSUMPTION { background: var(--yellow-dim); color: var(--yellow); }
  .type-TRADEOFF { background: var(--magenta-dim); color: var(--magenta); }
  .type-CONSTRAINT { background: var(--red-dim); color: var(--red); }
  .type-DEPENDENCY { background: var(--blue-dim); color: var(--blue); }
  .type-RISK { background: var(--red-dim); color: var(--red); }

  /* Sidebar timeline */
  .sidebar-timeline {
    flex: 1; overflow-y: auto; padding: 0.5rem;
    border-top: 1px solid var(--border);
  }
  .sidebar-timeline h3 {
    font-size: 0.7rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1px;
    padding: 0.5rem 0.5rem 0.3rem;
  }
  .timeline-entry {
    padding: 0.5rem 0.6rem; border-radius: 6px;
    cursor: pointer; border-left: 3px solid transparent;
    margin-bottom: 2px; transition: all 0.15s;
  }
  .timeline-entry:hover { background: var(--surface2); }
  .timeline-entry.has-change { border-left-color: var(--yellow); }
  .timeline-entry .te-date { font-size: 0.7rem; color: var(--text-muted); }
  .timeline-entry .te-summary { font-size: 0.75rem; color: var(--text); margin-top: 2px; }
  .te-type {
    display: inline-block; font-size: 0.6rem;
    padding: 1px 5px; border-radius: 3px;
    margin-right: 4px; font-weight: 600;
  }

  /* Main */
  .main {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; min-width: 0;
  }
  .main-header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 1rem;
  }
  .main-header h2 { font-size: 1rem; color: var(--text); font-weight: 600; }
  .main-content {
    flex: 1; overflow-y: auto; padding: 1.5rem;
    -webkit-overflow-scrolling: touch;
  }
  .header-search { flex: 1; max-width: 300px; margin-left: auto; }
  .header-search input {
    width: 100%; background: var(--surface);
    border: 1px solid var(--border); color: var(--text);
    padding: 0.4rem 0.8rem; border-radius: 6px;
    font-family: inherit; font-size: 0.78rem; outline: none;
  }
  .header-search input:focus { border-color: var(--accent); }

  /* Decision cards */
  .decision-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.8rem 1rem;
    cursor: pointer; transition: border-color 0.15s;
  }
  .decision-card:hover { border-color: var(--accent); }
  .dc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.3rem; }
  .dc-summary { font-size: 0.82rem; font-weight: 600; flex: 1; word-break: break-word; }
  .dc-meta { font-size: 0.65rem; color: var(--text-muted); white-space: nowrap; margin-left: 0.8rem; }
  .dc-reasoning { font-size: 0.75rem; color: var(--text-dim); line-height: 1.4; word-break: break-word; }
  .dc-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.4rem; }
  .tag { background: var(--tag-bg); color: var(--accent); padding: 1px 6px; border-radius: 3px; font-size: 0.65rem; }

  /* Diff view */
  .diff-container { max-width: 700px; margin: 0 auto; }
  .diff-badge {
    display: inline-block; background: var(--red-dim); color: var(--red);
    font-size: 0.7rem; font-weight: 700; padding: 3px 10px;
    border-radius: 4px; letter-spacing: 1px; margin-bottom: 0.8rem;
  }
  .diff-title { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 1.5rem; }
  .diff-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.5rem; margin-bottom: 1rem;
  }
  .diff-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 1.2rem; }
  .diff-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
  .diff-from, .diff-to { flex: 1; min-width: 200px; border-radius: 8px; padding: 1rem; }
  .diff-from { background: var(--red-dim); border: 1px solid rgba(248,113,113,0.2); }
  .diff-to { background: var(--green-dim); border: 1px solid rgba(74,222,128,0.2); }
  .diff-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.4rem; }
  .diff-from .diff-label { color: var(--red); }
  .diff-to .diff-label { color: var(--green); }
  .diff-value { font-size: 1.4rem; font-weight: 700; color: var(--text); }
  .diff-meta { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .diff-meta-row { display: flex; gap: 0.5rem; }
  .diff-meta-label { font-size: 0.72rem; color: var(--text-muted); min-width: 130px; }
  .diff-meta-value { font-size: 0.78rem; color: var(--text); line-height: 1.4; }
  .diff-meta-value.rejected { color: var(--red); }

  /* Query panel */
  .query-container { max-width: 700px; margin: 0 auto; }
  .query-input-wrap { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .query-input-wrap input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 0.8rem 1rem; border-radius: 8px;
    font-family: inherit; font-size: 0.85rem; outline: none;
  }
  .query-input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .query-input-wrap input::placeholder { color: var(--text-muted); }
  .query-input-wrap button {
    background: var(--accent); color: #fff; border: none;
    padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 0.85rem; font-weight: 600;
  }
  .query-input-wrap button:hover { background: var(--accent-dim); }
  .query-answer {
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: 10px; padding: 1.2rem 1.5rem;
    margin-bottom: 1.5rem; display: none;
  }
  .query-answer.visible { display: block; }
  .qa-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 0.6rem; }
  .qa-text { font-size: 0.85rem; color: var(--text); line-height: 1.6; }

  /* Lineage */
  .lineage-container { max-width: 700px; margin: 0 auto; }
  .lineage-node { position: relative; padding: 0.8rem 1rem 0.8rem 2rem; margin-left: 1rem; border-left: 2px solid var(--border-light); }
  .lineage-node:last-child { border-left-color: transparent; }
  .lineage-node::before {
    content: ''; position: absolute; left: -6px; top: 1rem;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--border-light); border: 2px solid var(--bg);
  }
  .lineage-node.change::before { background: var(--yellow); box-shadow: 0 0 8px var(--yellow-dim); }
  .lineage-node.rejected::before { background: var(--red); }
  .lineage-node .ln-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.8rem 1rem;
    cursor: pointer; transition: border-color 0.15s;
  }
  .lineage-node .ln-card:hover { border-color: var(--accent); }
  .lineage-node .ln-summary { font-size: 0.82rem; font-weight: 600; }
  .lineage-node .ln-reason { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.3rem; }
  .lineage-node .ln-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.3rem; }
  .lineage-arrow { margin-left: 1rem; padding: 0.2rem 0 0.2rem 2rem; font-size: 0.7rem; color: var(--text-muted); border-left: 2px solid var(--border-light); }

  .all-decisions { display: flex; flex-direction: column; gap: 0.5rem; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; width: 90%; max-width: 560px; max-height: 80vh; overflow-y: auto; }
  .modal h2 { font-size: 0.95rem; margin-bottom: 1rem; color: var(--accent); }
  .modal label { display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.2rem; margin-top: 0.7rem; }
  .modal input, .modal textarea, .modal select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 0.45rem 0.6rem; border-radius: 5px;
    font-family: inherit; font-size: 0.78rem; outline: none;
  }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
  .btn { border: none; padding: 0.45rem 1rem; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.78rem; font-weight: 600; }
  .btn:hover { opacity: 0.85; }
  .btn-cancel { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-delete { background: var(--red); color: #fff; margin-right: auto; }

  .loading, .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.82rem; }
  .loading::after {
    content: ''; display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--accent); border-top-color: transparent;
    border-radius: 50%; animation: spin 0.6s linear infinite;
    margin-left: 0.5rem; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; min-width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .sidebar-timeline { max-height: 120px; }
    .diff-row { flex-direction: column; }
    .main-header { flex-wrap: wrap; }
    .header-search { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>MEMORA <span>decision memory</span></h1>
      <div class="header-badges" style="display:flex;gap:0.5rem;margin-top:0.5rem;align-items:center">
        <span class="backend-badge" id="backendBadge">...</span>
        <span class="backend-badge badge-workspace" id="workspaceBadge" style="background:var(--surface2);color:var(--text-dim)">...</span>
      </div>
    </div>
    <div class="sidebar-stats" id="sidebarStats"><span class="loading">Loading</span></div>
    <div class="workspace-bar">
      <span>Workspace:</span>
      <select id="workspaceSelect" onchange="onWorkspaceChange()">
        <option value="">all</option>
        <option value="local">local</option>
      </select>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" data-view="timeline" onclick="switchView('timeline')"><span class="icon">|</span> Timeline</button>
      <button class="nav-btn" data-view="sessions" onclick="switchView('sessions')"><span class="icon">@</span> Sessions</button>
      <button class="nav-btn" data-view="query" onclick="switchView('query')"><span class="icon">?</span> Why Query</button>
      <button class="nav-btn" data-view="lineage" onclick="switchView('lineage')"><span class="icon">~</span> Lineage</button>
      <button class="nav-btn" data-view="all" onclick="switchView('all')"><span class="icon">#</span> All Decisions</button>
    </nav>
    <div class="type-filters" id="typeFilters">
      <button class="type-pill all active" onclick="filterType('')">ALL</button>
      <button class="type-pill type-DECISION" onclick="filterType('DECISION')">DECISION</button>
      <button class="type-pill type-REJECTED" onclick="filterType('REJECTED')">REJECTED</button>
      <button class="type-pill type-NEXT" onclick="filterType('NEXT')">NEXT</button>
      <button class="type-pill type-BUG_FIXED" onclick="filterType('BUG_FIXED')">BUG_FIXED</button>
      <button class="type-pill type-CONTEXT" onclick="filterType('CONTEXT')">CONTEXT</button>
      <button class="type-pill type-ASSUMPTION" onclick="filterType('ASSUMPTION')">ASSUMPTION</button>
      <button class="type-pill type-TRADEOFF" onclick="filterType('TRADEOFF')">TRADEOFF</button>
      <button class="type-pill type-RISK" onclick="filterType('RISK')">RISK</button>
    </div>
    <div class="sidebar-timeline" id="sidebarTimeline">
      <h3>Recent Activity</h3>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main">
    <div class="main-header">
      <h2 id="viewTitle">Reasoning Timeline</h2>
      <div class="header-search">
        <input type="text" id="globalSearch" placeholder="Search decisions..." onkeydown="if(event.key==='Enter')globalSearchDo()" />
      </div>
      <button class="btn btn-save" onclick="showAddModal()" style="margin-left:0.5rem">+ New</button>
    </div>
    <div class="main-content" id="mainContent">
      <div class="loading">Loading decisions</div>
    </div>
  </div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)hideModal()">
  <div class="modal">
    <h2 id="modalTitle">New Decision</h2>
    <input type="hidden" id="fId" />
    <label>Type</label>
    <select id="fType">
      <option value="DECISION">DECISION</option>
      <option value="REJECTED">REJECTED</option>
      <option value="NEXT">NEXT</option>
      <option value="BUG_FIXED">BUG_FIXED</option>
      <option value="CONTEXT">CONTEXT</option>
      <option value="ASSUMPTION">ASSUMPTION</option>
      <option value="TRADEOFF">TRADEOFF</option>
      <option value="CONSTRAINT">CONSTRAINT</option>
      <option value="DEPENDENCY">DEPENDENCY</option>
      <option value="RISK">RISK</option>
    </select>
    <label>Summary</label>
    <input type="text" id="fSummary" placeholder="What was decided" />
    <label>Reasoning</label>
    <textarea id="fReasoning" placeholder="Why this choice was made"></textarea>
    <label>Alternatives rejected (comma-separated)</label>
    <input type="text" id="fAlternatives" placeholder="Option A, Option B" />
    <label>Tags (comma-separated)</label>
    <input type="text" id="fTags" placeholder="database, auth, api" />
    <label>Project</label>
    <input type="text" id="fProject" placeholder="project-name" />
    <label>Agent / Author</label>
    <input type="text" id="fAgent" placeholder="name" />
    <div class="modal-actions">
      <button class="btn btn-delete" id="btnDelete" style="display:none" onclick="doDelete()">Delete</button>
      <button class="btn btn-cancel" onclick="hideModal()">Cancel</button>
      <button class="btn btn-save" onclick="doSave()">Save</button>
    </div>
  </div>
</div>

<script>
// ---- Configuration ----
// Uses relative paths so it works on both Vercel and local Flask
const API_BASE = window.location.origin;

// Detect which API shape to use:
// Cloud (Vercel): /api/memories, /api/sessions, /api/search, /api/stats, /api/ask, /api/backend
// Local (Flask):  /api/decisions, /api/timeline, /api/decisions/search, /api/stats, /api/why, /api/backend
let useCloudAPI = false;

let allDecisions = [];
let sessionsData = [];
let currentView = 'timeline';
let currentTypeFilter = '';
let currentWorkspace = '';
let backendMode = 'LOCAL';
let serverWorkspace = 'local';

// ---- API detection ----
async function detectAPI() {
  // Try cloud endpoint first
  try {
    const res = await fetch(`${API_BASE}/api/backend`);
    if (res.ok) {
      const data = await res.json();
      backendMode = data.mode || 'LOCAL';
      if (data.workspace && !currentWorkspace) {
        currentWorkspace = '';  // keep "all" selected, but show server workspace in badge
        serverWorkspace = data.workspace;
      }
      renderBackendBadge();
    }
  } catch (e) { /* ignore */ }

  // Test if /api/memories exists (Vercel) or fall back to /api/decisions (Flask)
  try {
    const res = await fetch(`${API_BASE}/api/memories?limit=1`);
    if (res.ok) { useCloudAPI = true; return; }
  } catch (e) { /* ignore */ }
  useCloudAPI = false;
}

function apiURL(endpoint, params = {}) {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) { if (v) p.set(k, v); }
  const qs = p.toString() ? '?' + p.toString() : '';

  if (useCloudAPI) {
    // Vercel endpoints
    const map = {
      'decisions': '/api/memories',
      'search': '/api/search',
      'stats': '/api/stats',
      'sessions': '/api/sessions',
      'ask': '/api/ask',
    };
    return `${API_BASE}${map[endpoint] || '/api/' + endpoint}${qs}`;
  } else {
    // Flask endpoints
    const map = {
      'decisions': '/api/decisions',
      'search': '/api/decisions/search',
      'stats': '/api/stats',
      'sessions': '/api/timeline',
      'ask': '/api/why',
    };
    return `${API_BASE}${map[endpoint] || '/api/' + endpoint}${qs}`;
  }
}

function renderBackendBadge() {
  const el = document.getElementById('backendBadge');
  el.textContent = backendMode;
  el.className = 'backend-badge badge-' + backendMode;
  // Workspace badge
  const ws = document.getElementById('workspaceBadge');
  const wsLabel = currentWorkspace || serverWorkspace;
  ws.textContent = wsLabel;
  ws.className = 'backend-badge badge-workspace';
}

// ---- Data loading ----
async function loadAll() {
  const wsParam = currentWorkspace ? { workspace: currentWorkspace } : {};
  const [dRes, sRes] = await Promise.all([
    fetch(apiURL('decisions', { limit: '200', ...wsParam })),
    fetch(apiURL('stats', wsParam)),
  ]);
  const dData = await dRes.json();
  allDecisions = dData.results || dData;  // unwrap pagination envelope
  const stats = await sRes.json();
  renderSidebarStats(stats);
  renderSidebarTimeline();
  renderCurrentView();
}

async function loadSessions() {
  const wsParam = currentWorkspace ? { workspace: currentWorkspace } : {};
  const res = await fetch(apiURL('sessions', { limit: '100', ...wsParam }));
  sessionsData = await res.json();
}

function filtered() {
  if (!currentTypeFilter) return allDecisions;
  return allDecisions.filter(d => d.type === currentTypeFilter);
}

function onWorkspaceChange() {
  currentWorkspace = document.getElementById('workspaceSelect').value;
  renderBackendBadge();
  loadAll();
}

function renderSidebarStats(s) {
  const types = s.types || {};
  document.getElementById('sidebarStats').innerHTML =
    `<div><strong>${s.total}</strong> total</div>` +
    `<div><strong>${Object.keys(s.tags || {}).length}</strong> tags</div>` +
    `<div><strong>${Object.keys(types).length}</strong> types</div>`;
}

function renderSidebarTimeline() {
  const el = document.getElementById('sidebarTimeline');
  const decisions = filtered();
  const groups = {};
  decisions.forEach(d => {
    const date = (d.created_at || '').substring(0, 10);
    if (!groups[date]) groups[date] = [];
    groups[date].push(d);
  });
  const dates = Object.keys(groups).sort().reverse();
  let html = '<h3>Recent Activity</h3>';
  dates.forEach(date => {
    const items = groups[date];
    const hasChange = items.some(d => ['REJECTED','BUG_FIXED'].includes(d.type));
    items.forEach(d => {
      const cls = hasChange && ['REJECTED','BUG_FIXED'].includes(d.type) ? 'has-change' : '';
      html += `<div class="timeline-entry ${cls}" onclick="showDetail('${d.id}')">
        <div class="te-date">${date}</div>
        <div class="te-summary"><span class="te-type type-${d.type || 'DECISION'}">${d.type || 'DECISION'}</span> ${esc(d.summary.substring(0, 50))}</div>
      </div>`;
    });
  });
  if (!decisions.length) html += '<div class="empty-state">No decisions yet</div>';
  el.innerHTML = html;
}

// ---- Views ----
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const titles = { timeline: 'Reasoning Timeline', sessions: 'Sessions', query: 'Why did this change?', lineage: 'Behavior Lineage', all: 'All Decisions' };
  document.getElementById('viewTitle').textContent = titles[view] || '';
  renderCurrentView();
}

function filterType(type) {
  currentTypeFilter = type;
  document.querySelectorAll('.type-pill').forEach(p => {
    if (type === '' && p.classList.contains('all')) p.classList.add('active');
    else if (p.textContent === type) p.classList.add('active');
    else p.classList.remove('active');
  });
  renderSidebarTimeline();
  renderCurrentView();
}

function renderCurrentView() {
  const el = document.getElementById('mainContent');
  switch (currentView) {
    case 'timeline': renderTimeline(el); break;
    case 'sessions': renderSessions(el); break;
    case 'query': renderQueryPanel(el); break;
    case 'lineage': renderLineage(el); break;
    case 'all': renderAllDecisions(el); break;
  }
}

// ---- Timeline ----
function renderTimeline(el) {
  const decisions = filtered();
  if (!decisions.length) { el.innerHTML = '<div class="empty-state">No decisions recorded yet. Click "+ New" to add one.</div>'; return; }
  const groups = {};
  decisions.forEach(d => {
    const date = (d.created_at || '').substring(0, 10);
    if (!groups[date]) groups[date] = [];
    groups[date].push(d);
  });
  const dates = Object.keys(groups).sort().reverse();
  let html = '';
  dates.forEach((date, i) => {
    const items = groups[date];
    const hasChange = items.some(d => ['REJECTED','BUG_FIXED'].includes(d.type));
    const num = dates.length - i;
    const badge = hasChange ? ' <span style="color:var(--yellow);font-size:0.75rem">CHANGE DETECTED</span>' : '';
    html += `<div style="margin-bottom:1.5rem"><div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem;display:flex;align-items:center;gap:0.5rem"><span style="font-weight:600;color:var(--text-dim)">Session ${num}</span><span>${date}</span>${badge}</div>`;
    items.forEach(d => {
      const chg = ['REJECTED','BUG_FIXED'].includes(d.type) ? 'border-left:3px solid var(--yellow);' : '';
      html += `<div class="decision-card" style="${chg}margin-bottom:0.5rem" onclick="showDetail('${d.id}')">
        <div class="dc-header"><div class="dc-summary"><span class="te-type type-${d.type||'DECISION'}">${d.type||'DECISION'}</span> ${esc(d.summary)}</div><div class="dc-meta">${esc(d.agent||d.source||'')}</div></div>
        <div class="dc-reasoning">${esc(d.reasoning)}</div>
        <div class="dc-tags">${(d.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
        ${(d.alternatives||[]).length?`<div style="font-size:0.7rem;color:var(--red);margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid var(--border)">Rejected: ${d.alternatives.map(esc).join(', ')}</div>`:''}
      </div>`;
    });
    html += '</div>';
  });
  el.innerHTML = html;
}

// ---- Sessions list ----
async function renderSessions(el) {
  el.innerHTML = '<div class="loading">Loading sessions</div>';
  await loadSessions();
  if (!sessionsData.length) { el.innerHTML = '<div class="empty-state">No sessions found.</div>'; return; }
  let html = '<div class="all-decisions">';
  sessionsData.forEach(s => {
    const badge = s.has_change ? '<span style="color:var(--yellow);font-size:0.7rem;margin-left:0.5rem">CHANGE</span>' : '';
    html += `<div class="decision-card" style="margin-bottom:0.5rem"><div class="dc-header"><div class="dc-summary">${esc(s.date)}${badge}</div><div class="dc-meta">${s.count} decision(s)</div></div><div class="dc-reasoning" style="margin-top:0.3rem">`;
    s.decisions.forEach(d => {
      html += `<div style="margin:0.2rem 0;cursor:pointer" onclick="showDetail('${d.id}')"><span class="te-type type-${d.type||'DECISION'}">${d.type||'DECISION'}</span> ${esc(d.summary)}</div>`;
    });
    html += '</div></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

// ---- Detail ----
function showDetail(id) {
  const d = allDecisions.find(x => x.id === id);
  if (!d) return;
  const related = allDecisions.find(r => r.id !== d.id && r.tags && d.tags && r.tags.some(t => d.tags.includes(t)) && r.type !== d.type);
  const el = document.getElementById('mainContent');
  document.getElementById('viewTitle').textContent = 'Decision Detail';
  let html = '<div class="diff-container">';
  if (related) {
    html += `<div class="diff-badge">CHANGE DETECTED</div><div class="diff-title">${(related.created_at||'').substring(0,10)} &rarr; ${(d.created_at||'').substring(0,10)}</div>
    <div class="diff-card"><h3>${esc(d.summary)}</h3><div class="diff-row"><div class="diff-from"><div class="diff-label">FROM</div><div class="diff-value">${esc(related.summary.substring(0,40))}</div></div><div class="diff-to"><div class="diff-label">TO</div><div class="diff-value">${esc(d.summary.substring(0,40))}</div></div></div>
    <div class="diff-meta"><div class="diff-meta-row"><div class="diff-meta-label">Reason:</div><div class="diff-meta-value">${esc(d.reasoning)}</div></div>
    ${(d.alternatives||[]).length?`<div class="diff-meta-row"><div class="diff-meta-label">Alternatives rejected:</div><div class="diff-meta-value rejected">${d.alternatives.map(esc).join(', ')}</div></div>`:''}
    ${d.agent?`<div class="diff-meta-row"><div class="diff-meta-label">Author:</div><div class="diff-meta-value">${esc(d.agent)}</div></div>`:''}</div></div>`;
  } else {
    html += `<div class="diff-card"><h3><span class="te-type type-${d.type||'DECISION'}">${d.type||'DECISION'}</span> ${esc(d.summary)}</h3><div class="diff-meta">
    <div class="diff-meta-row"><div class="diff-meta-label">Reasoning:</div><div class="diff-meta-value">${esc(d.reasoning)}</div></div>
    ${(d.alternatives||[]).length?`<div class="diff-meta-row"><div class="diff-meta-label">Alternatives:</div><div class="diff-meta-value rejected">${d.alternatives.map(esc).join(', ')}</div></div>`:''}
    ${(d.tags||[]).length?`<div class="diff-meta-row"><div class="diff-meta-label">Tags:</div><div class="diff-meta-value">${d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</div></div>`:''}
    ${d.agent?`<div class="diff-meta-row"><div class="diff-meta-label">Author:</div><div class="diff-meta-value">${esc(d.agent)}</div></div>`:''}
    ${d.project?`<div class="diff-meta-row"><div class="diff-meta-label">Project:</div><div class="diff-meta-value">${esc(d.project)}</div></div>`:''}
    <div class="diff-meta-row"><div class="diff-meta-label">Source:</div><div class="diff-meta-value">${esc(d.source||'unknown')}</div></div>
    <div class="diff-meta-row"><div class="diff-meta-label">Confidence:</div><div class="diff-meta-value">${d.confidence}</div></div>
    <div class="diff-meta-row"><div class="diff-meta-label">Created:</div><div class="diff-meta-value">${esc(d.created_at||'')}</div></div>
    </div></div>`;
  }
  html += `<button class="btn btn-cancel" onclick="switchView('${currentView}')" style="margin-top:1rem">&larr; Back</button></div>`;
  el.innerHTML = html;
}

// ---- Query ----
function renderQueryPanel(el) {
  el.innerHTML = `<div class="query-container"><div class="query-input-wrap"><input type="text" id="queryInput" placeholder="Why did refund threshold change?" onkeydown="if(event.key==='Enter')doQuery()" /><button onclick="doQuery()">Ask Memora</button></div><div class="query-answer" id="queryAnswer"><div class="qa-label">MEMORA ANSWER</div><div class="qa-text" id="queryAnswerText"></div></div><div class="query-decisions" id="queryDecisions"></div></div>`;
}

async function doQuery() {
  const input = document.getElementById('queryInput');
  if (!input) return;
  const question = input.value.trim();
  if (!question) return;
  const answerEl = document.getElementById('queryAnswer');
  const textEl = document.getElementById('queryAnswerText');
  const decEl = document.getElementById('queryDecisions');
  answerEl.classList.add('visible');
  textEl.innerHTML = '<span class="loading">Thinking</span>';
  decEl.innerHTML = '';
  try {
    const res = await fetch(apiURL('ask'), { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({question}) });
    const data = await res.json();
    textEl.textContent = data.answer || 'No answer available.';
    if (data.decisions && data.decisions.length) {
      let html = '<h4 style="font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:0.5rem 0">Related Decisions</h4>';
      data.decisions.forEach(d => {
        html += `<div class="decision-card" onclick="showDetail('${d.id}')" style="margin-bottom:0.5rem"><div class="dc-header"><div class="dc-summary"><span class="te-type type-${d.type||'DECISION'}">${d.type||'DECISION'}</span> ${esc(d.summary)}</div><div class="dc-meta">${(d.created_at||'').substring(0,10)}</div></div><div class="dc-reasoning">${esc(d.reasoning)}</div></div>`;
      });
      decEl.innerHTML = html;
    }
  } catch (e) { textEl.textContent = 'Error: ' + e.message; }
}

// ---- Lineage ----
function renderLineage(el) {
  const decisions = filtered();
  if (!decisions.length) { el.innerHTML = '<div class="empty-state">No decisions to visualize.</div>'; return; }
  const sorted = [...decisions].sort((a,b) => (a.created_at||'').localeCompare(b.created_at||''));
  let html = '<div class="lineage-container">';
  sorted.forEach((d, i) => {
    const isChange = ['REJECTED','BUG_FIXED'].includes(d.type);
    const cls = isChange ? (d.type==='REJECTED'?'rejected':'change') : '';
    const date = (d.created_at||'').substring(0,10);
    if (i > 0) html += '<div class="lineage-arrow">&darr;</div>';
    html += `<div class="lineage-node ${cls}"><div class="ln-card" onclick="showDetail('${d.id}')"><div class="ln-summary"><span class="te-type type-${d.type||'DECISION'}">${d.type||'DECISION'}</span> ${esc(d.summary)}</div><div class="ln-reason">${esc(d.reasoning.substring(0,120))}</div><div class="ln-meta">${date} ${d.agent?'&middot; '+esc(d.agent):''} ${d.project?'&middot; '+esc(d.project):''}</div></div></div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

// ---- All ----
function renderAllDecisions(el) {
  const decisions = filtered();
  if (!decisions.length) { el.innerHTML = '<div class="empty-state">No decisions found.</div>'; return; }
  let html = '<div class="all-decisions">';
  decisions.forEach(d => {
    const date = (d.created_at||'').substring(0,10);
    html += `<div class="decision-card" onclick="showDetail('${d.id}')"><div class="dc-header"><div class="dc-summary"><span class="te-type type-${d.type||'DECISION'}">${d.type||'DECISION'}</span> ${esc(d.summary)}</div><div class="dc-meta">${esc(d.source||'')} &middot; ${date}</div></div><div class="dc-reasoning">${esc(d.reasoning)}</div><div class="dc-tags">${(d.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${(d.alternatives||[]).length?`<div style="font-size:0.7rem;color:var(--red);margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid var(--border)">Rejected: ${d.alternatives.map(esc).join(', ')}</div>`:''}</div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

// ---- Search ----
async function globalSearchDo() {
  const q = document.getElementById('globalSearch').value.trim();
  if (!q) { loadAll(); return; }
  const res = await fetch(apiURL('search', { q }));
  const sData = await res.json();
  allDecisions = sData.results || sData;  // unwrap pagination envelope
  renderSidebarTimeline();
  renderCurrentView();
}

// ---- Modal ----
function showAddModal() {
  document.getElementById('modalTitle').textContent = 'New Decision';
  document.getElementById('fId').value = '';
  ['fType','fSummary','fReasoning','fAlternatives','fTags','fProject','fAgent'].forEach(id => { const el = document.getElementById(id); if (el.tagName==='SELECT') el.selectedIndex=0; else el.value=''; });
  document.getElementById('btnDelete').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('active');
}

async function doSave() {
  const body = {
    type: document.getElementById('fType').value,
    summary: document.getElementById('fSummary').value,
    reasoning: document.getElementById('fReasoning').value,
    alternatives: document.getElementById('fAlternatives').value.split(',').map(s=>s.trim()).filter(Boolean),
    tags: document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
    project: document.getElementById('fProject').value,
    agent: document.getElementById('fAgent').value,
    source: 'dashboard',
  };
  const url = useCloudAPI ? `${API_BASE}/api/memories` : `${API_BASE}/api/decisions`;
  await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  hideModal();
  loadAll();
}

async function doDelete() {
  const id = document.getElementById('fId').value;
  if (!id || !confirm('Delete this decision?')) return;
  await fetch(`${API_BASE}/api/decisions/${id}`, { method: 'DELETE' });
  hideModal();
  loadAll();
}

function hideModal() { document.getElementById('modalOverlay').classList.remove('active'); }

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ---- Polling ----
let _lastCount = 0;
async function pollForChanges() {
  try {
    const res = await fetch(apiURL('stats'));
    const s = await res.json();
    if (_lastCount && s.total !== _lastCount) loadAll();
    _lastCount = s.total;
  } catch (e) {}
}
setInterval(pollForChanges, 5000);

// ---- Init ----
(async function init() {
  await detectAPI();
  await loadAll();
})();
</script>
</body>
